# --- Minimalist Gruvbox Theme for Tmux ---

# General Settings
set -g default-terminal "screen-256color"
set -g terminal-overrides 'xterm*:Tc'
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g status-position bottom

# Gruvbox Minimalist Colors
set -g status-style 'bg=default,fg=#ebdbb2'

# Status Left: Only Session Name
set -g status-left-length 20
set -g status-left '#[fg=#b16286,bold] #S '

# Status Right: Only Date and Time (Removed CPU/RAM widgets)
set -g status-right-length 50
set -g status-right '#[fg=#928374] %Y-%m-%d 󱑇 %H:%M '

# Window Status (Clean and Simple)
set-window-option -g window-status-current-format '#[fg=#32302f,bg=#83a598,bold] #I:#W '
set-window-option -g window-status-format '#[fg=#928374,bg=default] #I:#W '

# Pane Borders
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#83a598'

# Keybindings
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Minimalist Config reloaded!"
